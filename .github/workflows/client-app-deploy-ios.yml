name: client-app-deploy-ios
#
# iOS 앱을 구워 TestFlight에 올린다. 안드로이드(client-app-deploy)의 짝이지만 전달 방식이 달라
# 파일을 나눴다 — APK는 받으면 바로 깔리지만 ipa는 TestFlight를 거쳐야 한다.
#
# 여기서는 유니티 배치 빌드와 S3 업로드만 한다. 서명·아카이브·업로드는 fastlane이 맡는다
# (fastlane/Fastfile) — iOS 고유의 복잡성을 YAML이 아니라 그쪽에 모아 둔다.
#
# ⚠️ AWS_ACCESS_KEY_ID는 secrets가 아니라 vars다 — 되돌리지 말 것.
#    프리사인 URL은 액세스 키 ID를 X-Amz-Credential에 담는데, 시크릿으로 등록돼 있으면 GitHub이
#    잡 요약에서 *** 로 가려 서명이 깨진다. 서명을 만드는 AWS_SECRET_ACCESS_KEY는 그대로 시크릿이다.
#
# ⚠️ APPLE_TEAM_ID·MATCH_S3_BUCKET은 일부러 여기서 안 넘긴다. Fastfile/Matchfile에 기본값이 있고,
#    GitHub 변수가 비어 있으면 빈 문자열이 넘어가 그 기본값을 덮어써 버린다(ENV.fetch는 "키가
#    있으면" 기본값을 안 쓴다). 팀이나 버킷을 바꿀 일이 생기면 그 두 파일을 고치는 편이 안전하다.
#
on:
  workflow_dispatch:
    inputs:
      environment:
        description: '대상 백엔드 환경'
        type: choice
        options:
          - dev
          - local-k8s
          - local
        default: dev
      development:
        description: '개발 빌드 (평문 http 허용 · 로그/프로파일러 유지)'
        type: boolean
        default: true
      skip_tests:
        description: '시험을 건너뛴다 (시험이 깨졌는데 급히 내보내야 할 때만)'
        type: boolean
        default: false

concurrency:
  group: client-app-deploy-ios
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: ap-northeast-2
  #  이 맥의 xcode-select는 CommandLineTools를 가리킨다. 전역 변경은 sudo가 필요하므로
  #  프로세스 단위로 Xcode를 지정한다.
  DEVELOPER_DIR: /Applications/Xcode-26.6.0.app/Contents/Developer
  #  Xcode 26의 altool에 패키지를 못 여는 회귀가 있다. 레거시 경로를 강제한다.
  DELIVER_ALTOOL_ADDITIONAL_UPLOAD_PARAMETERS: "--use-old-altool"

jobs:
  build-deploy:
    runs-on: [self-hosted, client]      # Client 전용 맥 러너
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive          # Assets/Art (public) 포함

      - name: sha 산출
        id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: 의존 UPM 패키지 레포 체크아웃 (file:../../ 형제 위치)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/.."
          for r in GameFramework LeagueOfPhysical-Shared LeagueOfPhysical-MasterData-Client; do
            if [ ! -d "$r/.git" ]; then
              git clone --depth 1 "https://github.com/Baeinsoo/$r" "$r"
            fi
            #  "지금 어느 브랜치에 있나"에 기대지 않는다. 러너의 이 폴더는 다른 워크플로와
            #  공유되는데 그쪽이 upstream 없는 로컬 브랜치(ci-build)에 올려두므로, @{u}에 기대면
            #  "no upstream configured"로 죽는다. 원하는 ref를 명시해 가져오고 고정 이름으로 붙인다.
            git -C "$r" fetch --depth 1 origin main
            git -C "$r" checkout -q -B ci-build FETCH_HEAD
            echo "$r @ $(git -C "$r" rev-parse --short HEAD)"
          done

      - name: NuGet 패키지 복원 (NuGetForUnity CLI, packages.config 기반)
        run: |
          set -e
          dotnet tool restore
          dotnet tool run nugetforunity restore .
          test -f Assets/NuGetForUnity/Packages/R3.1.3.1/lib/netstandard2.1/R3.dll

      - name: EditMode 시험 (실패하면 배포를 멈춘다)
        if: ${{ !inputs.skip_tests }}
        run: |
          set -o pipefail
          UNITY="/Applications/Unity/Hub/Editor/6000.3.16f1/Unity.app/Contents/MacOS/Unity"
          #  콘텐츠가 S3에 올라가기 *전에* 멈춰야 의미가 있다 — 올린 뒤에 막으면 이미 나간 것이다.
          #  -buildTarget을 여기서 한 번 주면 플랫폼 전환이 한 번만 일어나고 뒤 스텝들이 재사용한다.
          "$UNITY" -batchmode -nographics -projectPath . \
            -buildTarget iOS -runTests -testPlatform EditMode \
            -testResults test-results.xml -logFile - > unity-tests.log 2>&1 && RC=0 || RC=$?
          python3 - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          if not os.path.exists("test-results.xml"):
              print("::error::시험 결과 파일이 없다 — 유니티가 시험을 시작조차 못했다")
              sys.exit(0)
          r = ET.parse("test-results.xml").getroot()
          print("시험: total=%s passed=%s failed=%s skipped=%s"
                % (r.get("total"), r.get("passed"), r.get("failed"), r.get("skipped")))
          for tc in r.iter("test-case"):
              if tc.get("result") not in ("Passed", "Skipped"):
                  msg = (tc.findtext("failure/message") or "").strip().replace("\n", " ")[:300]
                  print("::error::%s — %s" % (tc.get("fullname"), msg))
          PY
          if [ "$RC" -ne 0 ]; then
            echo "::error::EditMode 시험 실패 — 배포를 멈춘다 (유니티 종료코드 $RC)"
            tail -40 unity-tests.log
            exit 1
          fi

      - name: 어드레서블 콘텐츠 full 빌드 (iOS)
        run: |
          set -eo pipefail
          UNITY="/Applications/Unity/Hub/Editor/6000.3.16f1/Unity.app/Contents/MacOS/Unity"
          if ! "$UNITY" -batchmode -quit -nographics -buildTarget iOS -projectPath . \
                -executeMethod BuildScript.BuildContentFull -logFile - > unity-content.log 2>&1; then
            echo "::error::content build failed"; tail -80 unity-content.log; exit 1
          fi
          #  빌드 서포트 모듈이 빠지면 -buildTarget이 조용히 무시되고 엉뚱한 플랫폼 것이 구워진다.
          grep -q "content full build target: iOS" unity-content.log
          test -f Assets/AddressableAssetsData/iOS/addressables_content_state.bin
          ls ServerData/iOS

      - name: 콘텐츠 업로드 (additive, --delete 금지)
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -e
          #  경로가 환경과 무관하게 dev 고정인 것은 안드로이드 쪽과 같다 — 어드레서블 프로파일의
          #  원격 경로가 그렇게 구워지기 때문이다. 환경별로 가르려면 프로파일부터 나눠야 한다.
          aws s3 sync ServerData/iOS "s3://lop-assets/dev/iOS"
          echo "콘텐츠 업로드 완료: s3://lop-assets/dev/iOS/"

      - name: Xcode 프로젝트 빌드
        env:
          BUILD_ENV: ${{ inputs.environment }}
          DEVELOPMENT: ${{ inputs.development }}
        run: |
          set -eo pipefail
          UNITY="/Applications/Unity/Hub/Editor/6000.3.16f1/Unity.app/Contents/MacOS/Unity"
          #  실패한 빌드는 지난번 폴더를 그대로 남긴다. 지우지 않으면 "있는지" 검사가 낡은 것을
          #  보고 통과해 버려, 옛 앱이 서명돼 올라간다.
          rm -rf Build/iOS Build/ipa
          DEV_FLAG=""
          if [ "$DEVELOPMENT" = "true" ]; then DEV_FLAG="-development"; fi
          if ! "$UNITY" -batchmode -quit -nographics -buildTarget iOS -projectPath . \
                -executeMethod BuildScript.BuildIOSXcodeProject \
                -buildEnv "$BUILD_ENV" $DEV_FLAG -logFile - > unity-xcode.log 2>&1; then
            echo "::error::Xcode project build failed"; tail -80 unity-xcode.log; exit 1
          fi
          #  폴더가 있는지가 아니라 빌드가 성공했다고 말했는지로 판정한다(위 주석과 같은 이유).
          grep -q "Xcode 프로젝트 OK" unity-xcode.log
          tail -5 unity-xcode.log

      - name: Ruby 의존성 설치
        env:
          PATH: /opt/homebrew/opt/ruby/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
        run: |
          set -eo pipefail
          bundle config set --local path vendor/bundle
          bundle install

      - name: 업로드 전 TestFlight 빌드 번호 기록
        env:
          PATH: /opt/homebrew/opt/ruby/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -eo pipefail
          bundle exec fastlane ios latest_build_number_to_file path:"$PWD/before.txt"
          echo "업로드 전 빌드 번호: $(cat before.txt)"

      - name: 서명 + TestFlight 업로드 (fastlane)
        id: upload
        env:
          PATH: /opt/homebrew/opt/ruby/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -eo pipefail
          BEFORE=$(cat before.txt)
          echo "업로드 전 빌드 번호: $BEFORE"

          #  성공의 진실원본은 fastlane의 종료 코드가 아니라 App Store Connect다.
          #
          #  altool은 업로드를 마치고도 프로세스가 안 끝난다(Xcode 26의 알려진 결함. 우리 환경에서
          #  세 번 재현했고 한 번은 3시간 44분 매달렸다). 우리는 이미 커뮤니티 우회책인
          #  `--use-old-altool`을 쓰고 있는데도 그렇다. 그래서 끝나기를 기다리지 않고,
          #  **애플이 새 빌드 번호를 보여 주는 순간 끊는다.** 20분이면 될 일에 90분을 쓰지 않는다.
          set -m
          ( bundle exec fastlane ios beta > fastlane.log 2>&1 ) &
          FL_PID=$!

          RC=""
          AFTER=""
          for i in $(seq 90); do           # 최대 90분
            if ! kill -0 "$FL_PID" 2>/dev/null; then
              if wait "$FL_PID"; then RC=0; else RC=$?; fi    # 스스로 끝났다
              break
            fi
            sleep 60
            #  업로드 단계 전에는 물어봐야 소용없다 — 빌드·아카이브에만 8분쯤 걸린다.
            #  다만 이 문구에만 기대지는 않는다(fastlane이 표현을 바꾸면 영영 안 물어보게 된다).
            #  15분이 지나면 문구와 무관하게 묻기 시작한다.
            if [ "$i" -lt 15 ] && ! grep -q "Ready to upload new build" fastlane.log 2>/dev/null; then
              continue
            fi
            bundle exec fastlane ios latest_build_number_to_file path:"$PWD/after.txt" >/dev/null 2>&1 || continue
            N=$(cat after.txt)
            if [ "$N" -gt "$BEFORE" ]; then
              AFTER="$N"
              echo "애플이 빌드 $N 을 보여 준다 — 업로드가 끝났다. 안 끝나는 altool을 끊는다."
              #  자식까지 함께 끊는다. fastlane만 죽이면 altool이 남아 며칠씩 돈다(실제로 그랬다).
              kill -TERM -"$FL_PID" 2>/dev/null || kill -TERM "$FL_PID" 2>/dev/null || true
              sleep 5
              kill -KILL -"$FL_PID" 2>/dev/null || true
              break
            fi
          done

          #  로그에 긴 base64(키)가 섞일 수 있어 걷어내고 보여 준다.
          grep -viE "[A-Za-z0-9+/]{60,}" fastlane.log | tail -30 || true

          if [ -z "$AFTER" ]; then
            #  스스로 끝났거나 시간이 다 됐다. 어느 쪽이든 애플에게 한 번 더 묻고 판정한다.
            bundle exec fastlane ios latest_build_number_to_file path:"$PWD/after.txt"
            AFTER=$(cat after.txt)
          fi

          if [ "$AFTER" -gt "$BEFORE" ]; then
            echo "업로드 성공 — 빌드 번호 $BEFORE → $AFTER (fastlane 종료코드: ${RC:-끊음})"
          else
            echo "::error::업로드 실패 — 빌드 번호가 $BEFORE 에서 움직이지 않았다."
            exit 1
          fi
          echo "build_number=$AFTER" >> "$GITHUB_OUTPUT"

      - name: 키체인 원상복구 (안전망)
        if: always()
        run: |
          set -e
          #  서명용 키체인은 fastlane이 스스로 지우지만, 프로세스가 중간에 죽으면 그 정리가
          #  안 돈다(2026-09-24에 실제로 그랬다). 이 맥은 사람이 직접 쓰는 기계라, 기본 키체인을
          #  빼앗긴 채로 두면 그쪽 작업이 막힌다. 그래서 잡이 어떻게 끝나든 여기서 한 번 더 본다.
          LOGIN="$HOME/Library/Keychains/login.keychain-db"
          if [ -f "$HOME/Library/Keychains/lop_ci.keychain-db" ]; then
            security delete-keychain "$HOME/Library/Keychains/lop_ci.keychain-db" || true
            echo "남아 있던 CI 키체인을 지웠다"
          fi
          CURRENT=$(security default-keychain | tr -d ' "')
          case "$CURRENT" in
            *login.keychain*) echo "기본 키체인 정상: $CURRENT" ;;
            *) security list-keychains -d user -s "$LOGIN"
               security default-keychain -d user -s "$LOGIN"
               echo "기본 키체인을 로그인 키체인으로 되돌렸다 (직전: $CURRENT)" ;;
          esac

      - name: content_state · dSYM 보존 + latest 갱신
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          BUILD_ENV: ${{ inputs.environment }}
          BUILD_NUMBER: ${{ steps.upload.outputs.build_number }}
        run: |
          set -e
          SHA="${{ steps.tag.outputs.sha }}"
          #  안드로이드는 builds/<env>/latest.json 을 쓴다. 돌아가는 그 경로를 건드리지 않으려고
          #  iOS는 한 칸 아래에 따로 둔다. 증분 콘텐츠 잡이 이 파일을 읽는다.
          DEST="s3://lop-client/builds/$BUILD_ENV/ios/$SHA"
          aws s3 cp Assets/AddressableAssetsData/iOS/addressables_content_state.bin \
            "$DEST/addressables_content_state.bin"

          #  dSYM이 없으면 크래시 로그가 와도 **어느 줄에서 죽었는지 못 읽는다** — 주소만 남는다.
          #  fastlane(gym)이 아카이브에서 뽑아 Build/ipa/ 에 넣어 두는데, 그 폴더는 다음 빌드가
          #  통째로 지우므로(Xcode 프로젝트 빌드 스텝) 여기서 건져 두지 않으면 사라진다.
          #  빌드 번호로 찾을 수 있게 파일 이름에 함께 박는다 — 크래시 리포트가 들고 오는 것이
          #  sha가 아니라 버전·빌드 번호이기 때문이다.
          DSYM="Build/ipa/lop.app.dSYM.zip"
          DSYM_KEY=""
          if [ -f "$DSYM" ]; then
            DSYM_KEY="$DEST/lop-build${BUILD_NUMBER}.app.dSYM.zip"
            aws s3 cp "$DSYM" "$DSYM_KEY"
            #  "지워도 되는 빌드 산출물"이라고 표시해 둔다. 버킷 수명 규칙이 이 태그만 보고
            #  오래된 것을 지운다 — 용량 같은 간접 조건으로 고르면 나중에 큰 파일이 하나 더
            #  생겼을 때 조용히 같이 지워진다. `latest.json`처럼 파이프라인이 의존하는 것은
            #  태그를 안 달았으므로 규칙에 걸리지 않는다.
            aws s3api put-object-tagging --bucket lop-client \
              --key "${DSYM_KEY#s3://lop-client/}" \
              --tagging 'TagSet=[{Key=kind,Value=build-artifact}]'
            echo "dSYM 보존: $DSYM_KEY (kind=build-artifact)"
          else
            #  배포 자체를 막을 일은 아니지만, 조용히 넘어가면 나중에 크래시를 못 읽는다.
            echo "::warning::dSYM($DSYM)이 없다 — 이 빌드의 크래시는 심볼화할 수 없다."
          fi

          printf '{"sha":"%s","environment":"%s","build_number":"%s","content_state":"%s/addressables_content_state.bin","dsym":"%s"}\n' \
            "$SHA" "$BUILD_ENV" "$BUILD_NUMBER" "$DEST" "$DSYM_KEY" > latest.json
          aws s3 cp latest.json "s3://lop-client/builds/$BUILD_ENV/ios/latest.json"
          echo "보존: $DEST/ , builds/$BUILD_ENV/ios/latest.json"

      - name: 요약 게시
        if: always()
        run: |
          {
            echo "## iOS $BUILD_ENV 빌드 \`${{ steps.tag.outputs.sha }}\`"
            echo
            if [ -n "${{ steps.upload.outputs.build_number }}" ]; then
              echo "TestFlight 빌드 번호 **${{ steps.upload.outputs.build_number }}** 로 올라갔다."
              echo
              echo "처리가 끝나면(보통 5~15분) 내부 테스터 폰의 TestFlight 앱에 나타난다."
            else
              echo "업로드까지 가지 못했다. 아래 로그 아티팩트를 볼 것."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          BUILD_ENV: ${{ inputs.environment }}

      - name: TestFlight 설치 QR 게시
        env:
          PATH: /opt/homebrew/opt/ruby/bin:/opt/homebrew/bin:/usr/bin:/bin:/usr/sbin:/sbin
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          BUILD_ENV: ${{ inputs.environment }}
        run: |
          set -eo pipefail
          #  링크를 GitHub 변수에 손으로 넣어 두지 않고 애플에게 묻는다 — 손으로 옮겨 적으면
          #  그룹을 다시 만든 날부터 조용히 낡은 링크를 뿌리게 된다.
          bundle exec fastlane ios public_link_to_file path:"$PWD/public_link.txt" >/dev/null 2>&1 || true
          LINK=$(cat public_link.txt 2>/dev/null || true)

          if [ -z "$LINK" ]; then
            #  외부 그룹이 없는 것은 실패가 아니다 — 아직 안 만든 것뿐이다. 무엇을 하면 되는지만 적는다.
            {
              echo
              echo "### 설치 링크 없음"
              echo
              echo "공개 링크를 켠 **외부 테스터 그룹**이 아직 없다. App Store Connect ▸ TestFlight ▸"
              echo "외부 테스트에서 그룹을 만들고 공개 링크를 켜면, 다음 실행부터 여기에 QR이 나온다."
              echo "(버전당 첫 빌드는 베타 심사를 거친다 — 통과 전에는 링크를 열어도 빈 화면이다.)"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          command -v qrencode >/dev/null || {
            echo "::error::러너에 qrencode가 없다. 맥 러너에서 'brew install qrencode' 1회 실행할 것."
            exit 1
          }

          SHA="${{ steps.tag.outputs.sha }}"
          #  안드로이드 QR은 매번 새로 만드는 프리사인 URL을 담지만, TestFlight 공개 링크는
          #  한 번 만들면 고정이다. 그래도 그림은 빌드마다 올려 둔다 — 요약이 data: URI 이미지를
          #  걷어내므로 어딘가에 올려 URL로 가리켜야 한다.
          qrencode -o qr.png -s 8 "$LINK"
          aws s3 cp qr.png "s3://lop-client/builds/$BUILD_ENV/ios/$SHA/qr.png"
          QR_URL=$(aws s3 presign "s3://lop-client/builds/$BUILD_ENV/ios/$SHA/qr.png" --expires-in 604800)
          {
            echo
            echo "### 설치"
            echo
            echo "![QR]($QR_URL)"
            echo
            echo "[TestFlight로 설치]($LINK)"
            echo
            echo "QR 그림 링크는 7일 후 만료된다. 설치 링크 자체는 고정이다."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 빌드 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            unity-tests.log
            test-results.xml
            unity-content.log
            unity-xcode.log
            fastlane.log
          if-no-files-found: warn
          retention-days: 14
