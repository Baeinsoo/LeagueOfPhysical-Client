name: client-app-deploy
#
# ⚠️ AWS_ACCESS_KEY_ID는 secrets가 아니라 vars다 — 되돌리지 말 것.
#    프리사인 URL은 SigV4 구조상 액세스 키 ID를 X-Amz-Credential에 담는다. 그 값이 시크릿으로
#    등록돼 있으면 GitHub이 잡 요약에서 *** 로 가려버리고, 서명이 깨져 링크·QR이 전부 접근 거부가
#    된다(2026-08-10 실측). 서명을 만드는 AWS_SECRET_ACCESS_KEY는 그대로 시크릿이다.
#
on:
  workflow_dispatch:
    inputs:
      environment:
        description: '대상 백엔드 환경'
        type: choice
        options:
          - dev
          - local-k8s
          - local
        default: dev
      development:
        description: '개발 빌드 (평문 http 허용 · 로그/프로파일러 유지)'
        type: boolean
        default: true

concurrency:
  group: client-app-deploy
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: ap-northeast-2

jobs:
  build-deploy:
    runs-on: [self-hosted, client]      # Client 전용 맥 러너
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive          # Assets/Art (public) 포함

      - name: sha 산출
        id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: 의존 UPM 패키지 레포 체크아웃 (file:../../ 형제 위치)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/.."
          for r in GameFramework LeagueOfPhysical-Shared LeagueOfPhysical-MasterData-Client; do
            if [ -d "$r/.git" ]; then
              git -C "$r" fetch --depth 1 origin && git -C "$r" reset --hard @{u}
            else
              git clone --depth 1 "https://github.com/Baeinsoo/$r" "$r"
            fi
            echo "$r @ $(git -C "$r" rev-parse --short HEAD)"
          done

      - name: NuGet 패키지 복원 (NuGetForUnity CLI, packages.config 기반)
        run: |
          set -e
          dotnet tool restore
          dotnet tool run nugetforunity restore .
          test -f Assets/NuGetForUnity/Packages/R3.1.3.1/lib/netstandard2.1/R3.dll

      - name: 어드레서블 콘텐츠 full 빌드 (Android)
        run: |
          set -eo pipefail
          UNITY="/Applications/Unity/Hub/Editor/6000.3.16f1/Unity.app/Contents/MacOS/Unity"
          if ! "$UNITY" -batchmode -quit -nographics -buildTarget Android -projectPath . \
                -executeMethod BuildScript.BuildAndroidContentFull -logFile - > unity-content.log 2>&1; then
            echo "::error::content build failed"; tail -80 unity-content.log; exit 1
          fi
          tail -15 unity-content.log
          test -f Assets/AddressableAssetsData/Android/addressables_content_state.bin
          ls ServerData/Android

      - name: 콘텐츠 업로드 (additive, --delete 금지)
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -e
          aws s3 sync ServerData/Android "s3://lop-assets/dev/Android"
          echo "콘텐츠 업로드 완료: s3://lop-assets/dev/Android/"

      - name: APK 빌드 (Android, 디버그 서명)
        env:
          BUILD_ENV: ${{ inputs.environment }}
          DEVELOPMENT: ${{ inputs.development }}
        run: |
          set -eo pipefail
          UNITY="/Applications/Unity/Hub/Editor/6000.3.16f1/Unity.app/Contents/MacOS/Unity"
          DEV_FLAG=""
          if [ "$DEVELOPMENT" = "true" ]; then DEV_FLAG="-development"; fi
          if ! "$UNITY" -batchmode -quit -nographics -buildTarget Android -projectPath . \
                -executeMethod BuildScript.BuildAndroidApk \
                -buildEnv "$BUILD_ENV" $DEV_FLAG -logFile - > unity-apk.log 2>&1; then
            echo "::error::APK build failed"; tail -80 unity-apk.log; exit 1
          fi
          tail -15 unity-apk.log
          test -f Build/lop.apk

      - name: APK + content_state 보존 (버전드) + latest 갱신
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          BUILD_ENV: ${{ inputs.environment }}
        run: |
          set -e
          SHA="${{ steps.tag.outputs.sha }}"
          DEST="s3://lop-client/builds/$BUILD_ENV/$SHA"
          aws s3 cp Build/lop.apk "$DEST/lop.apk"
          aws s3 cp Assets/AddressableAssetsData/Android/addressables_content_state.bin \
            "$DEST/addressables_content_state.bin"
          # latest 포인터 (③b가 읽음) — 환경별로 따로 둔다. 한 개면 dev 아닌 빌드가 baseline을 덮는다.
          printf '{"sha":"%s","environment":"%s","apk":"%s/lop.apk","content_state":"%s/addressables_content_state.bin"}\n' \
            "$SHA" "$BUILD_ENV" "$DEST" "$DEST" > latest.json
          aws s3 cp latest.json "s3://lop-client/builds/$BUILD_ENV/latest.json"
          echo "보존: $DEST/ , builds/$BUILD_ENV/latest.json -> $SHA"

      - name: QR + 다운로드 링크 게시
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          BUILD_ENV: ${{ inputs.environment }}
        run: |
          set -eo pipefail
          if ! command -v qrencode >/dev/null; then
            echo "::error::러너에 qrencode가 없다. 맥 러너에서 'brew install qrencode' 1회 실행할 것."
            exit 1
          fi
          SHA="${{ steps.tag.outputs.sha }}"
          DEST="s3://lop-client/builds/$BUILD_ENV/$SHA"
          APK_URL=$(aws s3 presign "$DEST/lop.apk" --expires-in 604800)
          # GitHub 요약은 data: URI 이미지를 걷어낸다 — PNG를 올려서 URL로 참조해야 한다.
          qrencode -o qr.png -s 8 "$APK_URL"
          aws s3 cp qr.png "$DEST/qr.png"
          QR_URL=$(aws s3 presign "$DEST/qr.png" --expires-in 604800)
          {
            echo "## $BUILD_ENV 빌드 \`$SHA\`"
            echo
            echo "![QR]($QR_URL)"
            echo
            echo "[APK 직접 다운로드]($APK_URL)"
            echo
            echo "링크는 7일 후 만료된다."
          } >> "$GITHUB_STEP_SUMMARY"
