name: client-ci

#  배포 워크플로는 수동 실행 전용이라, 그것만으로는 깨진 코드가 main에 들어가는 것을 막지 못한다
#  — 다음에 뭔가 배포하려는 순간에야 처음 실패한다. 이 워크플로가 푸시 시점에 먼저 잡는다.
#  (백엔드의 backend-ci와 같은 자리. 그쪽은 이미 이렇게 돌고 있었고 유니티만 빠져 있었다.)
#
#  ⚠️ 이 프로젝트는 GitHub PR을 쓰지 않는다 — 로컬에서 `--no-ff` 머지 후 main을 푸시한다
#  (CLAUDE.md 푸시 규약). 그래서 `pull_request` 트리거는 뜨지 않고, 여기서 할 수 있는 것은
#  "들어가기 전에 막는" 것이 아니라 "들어간 직후에 알리는" 것이다. 막으려면 작업 방식을
#  PR 기반으로 바꿔야 하는데 그건 CI가 아니라 팀의 선택이다.
#
#  ⚠️ 구멍: 형제 패키지 레포(GameFramework / LeagueOfPhysical-Shared / MasterData-Client)에
#  푸시해도 이 워크플로는 뜨지 않는다 — 그쪽 레포의 이벤트이기 때문이다. 시뮬 공유 코드가
#  거기 있어 실제로 아픈 자리다. 메꾸려면 그 레포들에서 이 워크플로를 원격으로 깨워야 하고
#  그건 PAT이 필요하다. 준비되면 추가할 것.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'

permissions:
  contents: read

#  같은 브랜치에 연달아 푸시하면 앞 실행은 취소한다 — 최신 커밋 결과만 의미가 있다.
#  (배포 워크플로는 반대로 취소하지 않는다 — 중간에 끊기면 산출물과 태그가 어긋난다.)
concurrency:
  group: client-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, client]      # 유니티가 깔린 맥 러너
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 의존 UPM 패키지 레포 체크아웃 (file:../../ 형제 위치)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/.."
          for r in GameFramework LeagueOfPhysical-Shared LeagueOfPhysical-MasterData-Client; do
            if [ ! -d "$r/.git" ]; then
              git clone --depth 1 "https://github.com/Baeinsoo/$r" "$r"
            fi
            git -C "$r" fetch --depth 1 origin main
            git -C "$r" checkout -q -B ci-build FETCH_HEAD
            echo "$r @ $(git -C "$r" rev-parse --short HEAD)"
          done

      - name: NuGet 패키지 복원 (NuGetForUnity CLI, packages.config 기반)
        run: |
          set -e
          dotnet tool restore
          dotnet tool run nugetforunity restore .
          test -f Assets/NuGetForUnity/Packages/R3.1.3.1/lib/netstandard2.1/R3.dll

      - name: EditMode 시험
        run: |
          set -o pipefail
          UNITY="/Applications/Unity/Hub/Editor/6000.3.16f1/Unity.app/Contents/MacOS/Unity"
          #  -buildTarget을 **준다**. 안 주면 러너에 남아 있던 타깃을 그대로 쓰는데, 그러면
          #  "몇 개를 돌릴지"가 직전에 무엇을 배포했느냐에 달린다 — 실제로 1960개와 1957개로
          #  갈렸다. 차이는 `#if UNITY_IOS`로 감싼 Info.plist 후처리 시험 3개다.
          #
          #  iOS로 고정하는 이유는 지금 플랫폼 조건이 걸린 시험이 그것뿐이기 때문이다.
          #  안드로이드 전용 조건부 시험이 생기면 이 한 줄로는 부족해지므로 타깃을 둘로
          #  돌리거나(매트릭스) 조건부 컴파일을 걷어내야 한다.
          #
          #  대가: 이 체크아웃은 배포 워크플로와 공유되므로 안드로이드 배포가 뒤따르면 타깃을
          #  되돌리며 재임포트가 돈다. 몇 개가 돌지 모르는 것보다는 그 시간이 낫다.
          "$UNITY" -batchmode -nographics -projectPath . \
            -buildTarget iOS -runTests -testPlatform EditMode \
            -testResults test-results.xml -logFile - > unity-tests.log 2>&1 && RC=0 || RC=$?
          python3 - <<'PY'
          import os, sys, xml.etree.ElementTree as ET
          if not os.path.exists("test-results.xml"):
              print("::error::시험 결과 파일이 없다 — 유니티가 시험을 시작조차 못했다")
              sys.exit(0)
          r = ET.parse("test-results.xml").getroot()
          print("시험: total=%s passed=%s failed=%s skipped=%s"
                % (r.get("total"), r.get("passed"), r.get("failed"), r.get("skipped")))
          for tc in r.iter("test-case"):
              if tc.get("result") not in ("Passed", "Skipped"):
                  msg = (tc.findtext("failure/message") or "").strip().replace("\n", " ")[:300]
                  print("::error::%s — %s" % (tc.get("fullname"), msg))
          PY
          if [ "$RC" -ne 0 ]; then
            echo "::error::EditMode 시험 실패 (유니티 종료코드 $RC)"
            tail -40 unity-tests.log
            exit 1
          fi

      - name: 시험 결과 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-test-results
          path: |
            test-results.xml
            unity-tests.log
          if-no-files-found: warn
          retention-days: 14
