name: content-deploy
on:
  workflow_dispatch:
    inputs:
      target:
        description: "빌드·업로드 대상"
        required: true
        default: gameserver
        type: choice
        options: [gameserver, standalone, client-app, all]

concurrency:
  group: content-deploy
  cancel-in-progress: false

env:
  AWS_DEFAULT_REGION: ap-northeast-2

jobs:
  # 어떤 플랫폼을 구울지 고른다. 매트릭스는 정적이라 입력에 따라 바꾸려면 이렇게 JSON으로 넘겨야 한다.
  plan:
    runs-on: [self-hosted, client]
    outputs:
      targets: ${{ steps.pick.outputs.targets }}
    steps:
      - id: pick
        run: |
          set -e
          case "${{ inputs.target }}" in
            gameserver)        T='["StandaloneLinux64"]' ;;
            standalone|all)    T='["StandaloneLinux64","StandaloneOSX","StandaloneWindows64"]' ;;
            client-app)        T='[]' ;;
            *) echo "::error::알 수 없는 target: ${{ inputs.target }}"; exit 1 ;;
          esac
          echo "targets=$T" >> "$GITHUB_OUTPUT"
          echo "구울 플랫폼: $T"

  build-deploy:
    if: inputs.target == 'client-app' || inputs.target == 'all'
    runs-on: [self-hosted, client]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 의존 UPM 패키지 레포 체크아웃
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/.."
          for r in GameFramework LeagueOfPhysical-Shared LeagueOfPhysical-MasterData-Client; do
            if [ -d "$r/.git" ]; then
              git -C "$r" fetch --depth 1 origin && git -C "$r" reset --hard @{u}
            else
              git clone --depth 1 "https://github.com/Baeinsoo/$r" "$r"
            fi
          done

      - name: NuGet 패키지 복원 (NuGetForUnity CLI, packages.config 기반)
        run: |
          set -e
          dotnet tool restore
          dotnet tool run nugetforunity restore .
          test -f Assets/NuGetForUnity/Packages/R3.1.3.1/lib/netstandard2.1/R3.dll

      - name: baseline content_state 다운로드 (S3 latest)
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -e
          if ! aws s3 cp "s3://lop-client/builds/dev/latest.json" latest.json 2>/dev/null; then
            echo "::error::builds/dev/latest.json 없음 — ③a(client-app-deploy)를 dev로 먼저 실행해 baseline을 만드세요."; exit 1
          fi
          STATE_KEY=$(python3 -c "import json;print(json.load(open('latest.json'))['content_state'])")
          echo "baseline: $STATE_KEY"
          mkdir -p Assets/AddressableAssetsData/Android
          aws s3 cp "$STATE_KEY" Assets/AddressableAssetsData/Android/addressables_content_state.bin

      - name: 어드레서블 콘텐츠 update 빌드 (Update a Previous Build)
        run: |
          set -eo pipefail
          UNITY="/Applications/Unity/Hub/Editor/6000.3.16f1/Unity.app/Contents/MacOS/Unity"
          if ! "$UNITY" -batchmode -quit -nographics -buildTarget Android -projectPath . \
                -executeMethod BuildScript.BuildAndroidContentUpdate -logFile - > unity-content.log 2>&1; then
            echo "::error::content update failed"; tail -80 unity-content.log; exit 1
          fi
          tail -15 unity-content.log
          ls ServerData/Android

      - name: 콘텐츠 업로드 (additive, --delete 금지)
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -e
          aws s3 sync ServerData/Android "s3://lop-assets/dev/Android"
          echo "콘텐츠 갱신 완료: s3://lop-assets/dev/Android/"

  # 스탠드얼론 플랫폼 콘텐츠(게임서버 Linux + 데스크톱 macOS/Windows).
  # 이 플랫폼들은 플레이어를 매번 새로 빌드하므로 이미 깔린 설치본과의 호환을 지킬 필요가 없다 —
  # 그래서 증분이 아니라 full로 굽는다. 안드로이드는 배포된 앱이 있어 증분(build-deploy)으로 남는다.
  build-deploy-standalone:
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    runs-on: [self-hosted, client]
    strategy:
      # 러너가 1대고 같은 프로젝트 체크아웃을 쓰므로 유니티를 동시에 두 개 돌릴 수 없다.
      max-parallel: 1
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 의존 UPM 패키지 레포 체크아웃
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/.."
          for r in GameFramework LeagueOfPhysical-Shared LeagueOfPhysical-MasterData-Client; do
            if [ -d "$r/.git" ]; then
              git -C "$r" fetch --depth 1 origin && git -C "$r" reset --hard @{u}
            else
              git clone --depth 1 "https://github.com/Baeinsoo/$r" "$r"
            fi
          done

      - name: NuGet 패키지 복원 (NuGetForUnity CLI, packages.config 기반)
        run: |
          set -e
          dotnet tool restore
          dotnet tool run nugetforunity restore .
          test -f Assets/NuGetForUnity/Packages/R3.1.3.1/lib/netstandard2.1/R3.dll

      - name: 어드레서블 콘텐츠 full 빌드 (${{ matrix.target }})
        run: |
          set -eo pipefail
          UNITY="/Applications/Unity/Hub/Editor/6000.3.16f1/Unity.app/Contents/MacOS/Unity"
          if ! "$UNITY" -batchmode -quit -nographics -buildTarget ${{ matrix.target }} -projectPath . \
                -executeMethod BuildScript.BuildContentFull -logFile - > unity-content-${{ matrix.target }}.log 2>&1; then
            echo "::error::${{ matrix.target }} content build failed"; tail -80 unity-content-${{ matrix.target }}.log; exit 1
          fi

      - name: 산출물 확인
        run: |
          set -e
          test -f ServerData/${{ matrix.target }}/catalog_0.1.bin
          grep -qa FlappyRaceMap ServerData/${{ matrix.target }}/catalog_0.1.bin
          grep -qa Bird.prefab ServerData/${{ matrix.target }}/catalog_0.1.bin

      - name: S3 업로드
        env:
          AWS_ACCESS_KEY_ID: ${{ vars.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -e
          aws s3 sync ServerData/${{ matrix.target }} "s3://lop-assets/dev/${{ matrix.target }}"
          echo "콘텐츠 갱신 완료: s3://lop-assets/dev/${{ matrix.target }}/"
