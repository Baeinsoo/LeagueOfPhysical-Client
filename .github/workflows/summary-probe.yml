name: summary-probe
# 일회성 진단용. 프리사인 URL이 왜 접근 거부되는지 가른다. 확인 후 삭제.
on:
  workflow_dispatch:

env:
  AWS_DEFAULT_REGION: ap-northeast-2

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: S3 읽기 권한·리전·프리사인 실제 응답 확인
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set +e   # 각 항목을 끝까지 다 보고 싶다
          KEY="builds/dev/cce847b/qr.png"

          echo "=== 1. 자격증명 주체 ==="
          aws sts get-caller-identity --output text 2>&1 | head -3

          echo "=== 2. 버킷 리전 (설정한 값과 다르면 서명이 안 맞는다) ==="
          echo "설정 리전: $AWS_DEFAULT_REGION"
          aws s3api get-bucket-location --bucket lop-client --output text 2>&1 | head -3

          echo "=== 3. HeadObject (s3:GetObject 권한이 필요하다) ==="
          aws s3api head-object --bucket lop-client --key "$KEY" 2>&1 | head -8

          echo "=== 4. 실제 읽기 ==="
          aws s3 cp "s3://lop-client/$KEY" - 2>&1 | wc -c

          echo "=== 5. 프리사인 URL을 실제로 GET (결정적 증거) ==="
          URL=$(aws s3 presign "s3://lop-client/$KEY" --expires-in 3600)
          echo "URL 길이: ${#URL}"
          CODE=$(curl -s -o /tmp/resp.xml -w "%{http_code}" "$URL")
          echo "HTTP $CODE"
          echo "--- 응답 본문의 에러 코드/메시지만 ---"
          grep -oE "<Code>[^<]*</Code>|<Message>[^<]*</Message>" /tmp/resp.xml | head -4
          echo "(본문 크기: $(wc -c < /tmp/resp.xml) bytes)"

          echo "=== 6. 저장된 Content-Type (이미지가 아니면 GitHub 프록시가 거부한다) ==="
          aws s3api head-object --bucket lop-client --key "$KEY" --query ContentType --output text 2>&1 | head -2
